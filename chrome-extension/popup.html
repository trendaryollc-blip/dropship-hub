<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; padding: 16px; font-family: -apple-system, sans-serif; background: #0a0a0f; color: #f3f4f6; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    .product-info { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .product-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
    .product-price { color: #22c55e; font-size: 18px; font-weight: 700; }
    .product-price.null { color: #6b7280; font-size: 14px; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
    .btn-primary { background: #7c3aed; color: white; }
    .btn-primary:hover { background: #6d28d9; }
    .btn-secondary { background: #1f2937; color: #d1d5db; border: 1px solid #374151; }
    .btn-secondary:hover { background: #374151; }
    .status { text-align: center; font-size: 12px; color: #6b7280; margin-top: 8px; }
    .status.success { color: #22c55e; }
    .status.error { color: #ef4444; }
    .loading { text-align: center; color: #6b7280; padding: 20px; }
    .auth-section { margin-bottom: 12px; }
    .auth-section input { width: 100%; padding: 8px; border: 1px solid #374151; border-radius: 6px; background: #111827; color: #f3f4f6; font-size: 13px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>DropShip Hub</h1>
  
  <div id="auth-section" class="auth-section">
    <input type="password" id="token-input" placeholder="Paste your Firebase ID token...">
    <button class="btn btn-secondary" id="save-token" style="margin-top: 8px;">Save Token</button>
  </div>

  <div id="product-section" style="display: none;">
    <div class="product-info">
      <div class="product-title" id="product-title">Loading...</div>
      <div class="product-price" id="product-price">--</div>
    </div>
    <button class="btn btn-primary" id="save-btn">Save to DropShip Hub</button>
    <button class="btn btn-secondary" id="open-dashboard">Open Dashboard</button>
    <div class="status" id="status"></div>
  </div>

  <div id="loading" class="loading">Detecting product...</div>

  <script src="popup.js"></script>
</body>
</html>
